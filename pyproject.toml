[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pmu-simulator"
version = "0.1.0"
description = "Simulateur modulaire de synchrophaseur triphasé"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
pmu-sim = "pmu_simulator.cli:main"

[tool.setuptools.packages.find]
include = ["pmu_simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
